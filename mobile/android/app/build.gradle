import org.gradle.api.GradleException
import org.gradle.api.file.DuplicatesStrategy
import org.gradle.api.tasks.Sync

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

// New Architecture codegen repeats absolute source paths in native object
// names. Keep the CMake staging root short so Windows builds are not dependent
// on where a developer checked out the repository.
def nativeBuildKey = Integer.toUnsignedString(rootProject.projectDir.absolutePath.hashCode(), 16)
def nativeBuildStagingDirectory = new File(
    System.getProperty("java.io.tmpdir"),
    "rotorlens-cxx-${nativeBuildKey}"
)

def viewerWebRoot = rootProject.projectDir.parentFile.parentFile
def generatedViewerAssets = layout.buildDirectory.dir("generated/viewerAssets")

// Use repository history for monotonic RotorLens preview versions. The new
// package ID can coexist with legacy org.rotorflight.blackbox installations.
def gitCommitCount = 1
try {
    def safeViewerWebRoot = viewerWebRoot.absolutePath.replace('\\', '/')
    def process = new ProcessBuilder(
        "git",
        "-c",
        "safe.directory=${safeViewerWebRoot}",
        "rev-list",
        "--count",
        "HEAD"
    )
        .directory(viewerWebRoot)
        .redirectErrorStream(true)
        .start()
    def output = process.inputStream.getText("UTF-8").trim()
    if (process.waitFor() == 0 && output.isInteger()) {
        gitCommitCount = output.toInteger()
    }
} catch (Exception ignored) {
    // A source archive without git metadata keeps the installable fallback.
}

def userDebugKeystore = new File(
    System.getProperty("user.home"),
    ".android/debug.keystore"
)
def templateDebugKeystore = file("debug.keystore")
def resolvedDebugKeystore = userDebugKeystore.isFile()
    ? userDebugKeystore
    : templateDebugKeystore

def syncViewerAssets = tasks.register("syncViewerAssets", Sync) {
    from(viewerWebRoot) {
        include "index.html"
        include "index.js"
        include "changelog.html"
        include "manifest.json"
        include "LICENSE"
        include "NOTICE.md"
        include "THIRD_PARTY_NOTICES.md"
        include "legal/**"
        include "css/**"
        include "images/**"
        include "js/**"
        include "locales/**"
        include "_locales/**"
        include "resources/**"
        include "node_modules/bootstrap/**"
        include "node_modules/html2canvas/**"
        include "node_modules/lodash/**"
        include "node_modules/webm-writer/**"
    }

    into generatedViewerAssets
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.FAIL

    doFirst {
        def requiredViewerFiles = [
            "LICENSE",
            "NOTICE.md",
            "THIRD_PARTY_NOTICES.md",
            "legal/APACHE-2.0.txt",
            "node_modules/bootstrap/dist/css/bootstrap.min.css",
            "node_modules/html2canvas/dist/html2canvas.min.js",
            "node_modules/lodash/lodash.min.js",
            "node_modules/webm-writer/WebMWriter.js",
        ]
        def missingViewerFiles = requiredViewerFiles.findAll {
            !new File(viewerWebRoot, it).isFile()
        }
        if (!missingViewerFiles.isEmpty()) {
            throw new GradleException(
                "Blackbox viewer dependencies are missing from the repository root: " +
                    missingViewerFiles.join(", ") +
                    ". Run 'npm install' (or 'yarn install') in the repository root."
            )
        }
    }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    externalNativeBuild {
        cmake {
            buildStagingDirectory nativeBuildStagingDirectory
        }
    }

    namespace "io.github.mbwallace1390.rotorlens"
    defaultConfig {
        applicationId "io.github.mbwallace1390.rotorlens"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gitCommitCount
        versionName "0.1.${gitCommitCount}"
    }
    signingConfigs {
        debug {
            // Prefer Android Studio's stable per-user debug identity. The
            // template key is only a bootstrap fallback on a fresh machine.
            storeFile resolvedDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        preview {
            // Preview artifacts use one public development identity locally
            // and in CI so testers can install upgrades without cert races.
            storeFile templateDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        preview {
            // A self-contained device build: bundle React Native JavaScript,
            // but use the stable development key rather than release signing.
            initWith release
            signingConfig signingConfigs.preview
            matchingFallbacks = ["release"]
            manifestPlaceholders["usesCleartextTraffic"] = "false"
            versionNameSuffix "-preview"
        }
        release {
            // Intentionally unsigned until CI or the release operator supplies
            // the production RotorLens keystore.
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir generatedViewerAssets.get().asFile
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn syncViewerAssets
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.activity:activity:1.13.0")
    implementation("androidx.webkit:webkit:1.16.0")
    testImplementation("junit:junit:4.13.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
