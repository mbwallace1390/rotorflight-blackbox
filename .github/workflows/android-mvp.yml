name: Android MVP

# Build test APKs from one event/ref so the development signing cache has one
# stable lineage. Branch-push and pull-request caches are intentionally not mixed.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "css/android.css"
      - "index.js"
      - "js/localization.js"
      - "js/pref_storage.js"
      - ".github/workflows/android-mvp.yml"

permissions:
  contents: read

concurrency:
  group: rotorflight-blackbox-android-signing-v4
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16.20.2"
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install Blackbox web dependencies
        run: yarn install --frozen-lockfile

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Android test signing key
        id: signing-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rotorflight-blackbox-android-debug-signing-v4

      - name: Create or verify Android test signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          echo "cache-hit=${{ steps.signing-key-cache.outputs.cache-hit }}" > android-signing-cache.txt
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "generated-new-key=true" >> android-signing-cache.txt
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Rotorflight Android Debug,O=Rotorflight,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "generated-new-key=false" >> android-signing-cache.txt
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | tee android-signing-certificate.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        id: android-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_PREFS_ROOT="$HOME/.android"
          gradle -Duser.home="$HOME" -p android assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotorflight-blackbox-android-build-log
          path: |
            android-build.log
            android-signing-cache.txt
            android-signing-certificate.txt
          if-no-files-found: error

      - name: Upload debug APK
        if: steps.android-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rotorflight-blackbox-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report Android build failure
        if: steps.android-build.outcome != 'success'
        run: exit 1
