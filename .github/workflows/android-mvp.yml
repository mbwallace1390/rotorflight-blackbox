name: Android MVP

on:
  workflow_dispatch:
  push:
    branches:
      - android-mvp
    paths:
      - "android/**"
      - "css/android.css"
      - "index.js"
      - "js/localization.js"
      - "js/pref_storage.js"
      - ".github/workflows/android-mvp.yml"
  pull_request:
    paths:
      - "android/**"
      - "css/android.css"
      - "index.js"
      - "js/localization.js"
      - "js/pref_storage.js"
      - ".github/workflows/android-mvp.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16.20.2"
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install Blackbox web dependencies
        run: yarn install --frozen-lockfile

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        id: android-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p android assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotorflight-blackbox-android-build-log
          path: android-build.log
          if-no-files-found: error

      - name: Upload debug APK
        if: steps.android-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rotorflight-blackbox-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report Android build failure
        if: steps.android-build.outcome != 'success'
        run: exit 1
